<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="weatherapi.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title> Weather API</title>
</head>

<body>

    <div id="app">
        <!-- Search Bar -->
        <div id="searchBar">
            <input type="text" id="searchBarInput" placeholder="Search by City"
                onkeydown="if(event.key==='Enter') getWeather()">
            <button onclick="getWeather()" id="searchIcon">
                <i class="fa fa-search" aria-hidden="true"></i>
            </button>
        </div>

        <!-- Date & City -->
        <div id="info">
            <p id="date"></p>
            <h3 id="city"></h3>
        </div>

        <!-- Weather Image -->
        <div id="tempImg"></div>

        <!-- Description -->
        <div id="description"></div>

        <!-- Temp -->
        <div id="temp"></div>
        <!-- Extra Into -->
        <div id="extraInfo">
            <div id="col">
                <div id="info">
                    <h5>Highs</h5>
                    <p id="tempMax"></p>
                </div>
            </div>
            <div id="info">
                <h5>Lows</h5>
                <p id="tempMin"></p>
            </div>

        </div>
    </div>
</body>

<script src="weatherapi.js"></script>

</html>
